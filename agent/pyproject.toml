[project]
name = "news-agent"
version = "0.15.0"
description = "LangGraph news research agent that populates the robot-overlord-news database"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-ollama>=0.2",
    "langchain-community>=0.3",
    "langgraph>=1.2",
    "ddgs>=7.0",
    "rich>=15.0.0",
    "typesafe-sdk>=0.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Emitted at import time by langgraph.checkpoint.serde.encrypted's default
    # JsonPlusSerializer() argument — not triggered by our code, and harmless.
    "ignore::langchain_core._api.deprecation.LangChainPendingDeprecationWarning",
]
