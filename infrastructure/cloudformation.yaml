AWSTemplateFormatVersion: "2010-09-09"
Description: Robot Overlord News - EC2 instance with Nginx reverse proxy

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t3.medium]
    Description: EC2 instance type

  AllowedSSHCidr:
    Type: String
    Description: Your IP address in CIDR notation for SSH access (e.g. 1.2.3.4/32)
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"

  DomainName:
    Type: String
    Description: Domain name for the site (e.g. news.example.com) - used in Nginx config
    Default: ""

Resources:
  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Robot Overlord News security group
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSSHCidr
          Description: SSH from your IP only
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      Tags:
        - Key: Name
          Value: robot-overlord-news

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      # Amazon Linux 2023 (us-east-1) - update AMI ID for your region:
      # us-east-1: ami-0453ec754f44f9a4a
      # us-east-2: ami-0cbb3e1cc77adcd1c
      # us-west-1: ami-0e9d72b21818eeff9
      # us-west-2: ami-0135ecc1c7e8b4202
      # eu-west-1: ami-01fdb1eb6c3d4bc69
      # Find yours: aws ec2 describe-images --owners amazon \
      #   --filters "Name=name,Values=al2023-ami-*-x86_64" \
      #   --query 'sort_by(Images,&CreationDate)[-1].ImageId'
      ImageId: ami-083eb03ee8ae87bb1
      SecurityGroups:
        - !Ref SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          exec > >(tee /var/log/user-data.log | logger -t user-data) 2>&1

          dnf update -y
          dnf install -y nginx python3-certbot-nginx

          # Create service user and directory structure
          useradd -r -s /sbin/nologin news
          mkdir -p /opt/news/data /opt/news/templates /opt/news/static
          chown -R news:news /opt/news

          # Install systemd service
          cat > /etc/systemd/system/news.service << 'EOF'
          [Unit]
          Description=Robot Overlord News
          After=network.target

          [Service]
          ExecStart=/opt/news/news_site
          Environment=NEWS_DB=/opt/news/data/news.db
          WorkingDirectory=/opt/news
          Restart=always
          RestartSec=5
          User=news

          [Install]
          WantedBy=multi-user.target
          EOF

          # Install Nginx config
          cat > /etc/nginx/conf.d/news.conf << 'EOF'
          server {
              listen 80;
              server_name ${DomainName};

              gzip on;
              gzip_types text/html text/css application/javascript;

              location /static/ {
                  alias /opt/news/static/;
                  expires 7d;
                  add_header Cache-Control "public, immutable";
              }

              location / {
                  proxy_pass http://localhost:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF

          # Remove default Nginx site
          rm -f /etc/nginx/conf.d/default.conf

          systemctl daemon-reload
          systemctl enable nginx
          systemctl start nginx
          systemctl enable news
          # news service won't start until binary is deployed; that's fine

          echo "User data setup complete"

      Tags:
        - Key: Name
          Value: robot-overlord-news

  ElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: robot-overlord-news

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      EIP: !Ref ElasticIP

Outputs:
  PublicIP:
    Description: Elastic IP address - point your domain's A record here
    Value: !Ref ElasticIP

  InstanceId:
    Description: EC2 instance ID
    Value: !Ref Instance

  SSHCommand:
    Description: Command to SSH into the instance
    Value: !Sub "ssh ec2-user@${ElasticIP}"

  NewsAppDirectory:
    Description: Directory where the app files live on the instance
    Value: /opt/news/
