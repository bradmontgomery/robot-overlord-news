# Nginx config for Robot Overlord News
# This is the reference copy. The UserData script in cloudformation.yaml
# writes a copy of this to /etc/nginx/conf.d/news.conf on first boot.
#
# After running `certbot --nginx -d yourdomain.com`, Certbot will rewrite
# this file to add the HTTPS server block and HTTP->HTTPS redirect.
#
# To manually install/update: scp this file to /etc/nginx/conf.d/news.conf
# then run: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name yourdomain.com;  # replace with your actual domain

    gzip on;
    gzip_types text/html text/css application/javascript;

    # Serve static files directly from disk (avoids a Go round-trip)
    location /static/ {
        alias /opt/news/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
