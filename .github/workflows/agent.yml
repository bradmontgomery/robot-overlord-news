name: agent

on:
  push:
    branches: [main]
    paths: ['agent/**', 'schema.sql', '.github/workflows/agent.yml']
  pull_request:
    branches: [main]
    paths: ['agent/**', 'schema.sql', '.github/workflows/agent.yml']

# Test only. The agent runs on a GPU box, never on the web host, so nothing deploys from here.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: agent/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: make test
